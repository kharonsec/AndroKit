[package]
name = "androkit"
version = "1.0.0"
edition = "2021"
description = "Cross-platform GUI front-end for ADB and Fastboot device operations."
license = "GPL-3.0-or-later"
repository = "https://github.com/kharonsec/androkit"
readme = "README.md"
keywords = ["android", "adb", "fastboot", "gui"]
categories = ["command-line-utilities"]

[dependencies]
eframe = "0.27"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rfd = "0.14"
crossbeam-channel = "0.5"
sha2 = "0.10"
aes-gcm = "0.10"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
